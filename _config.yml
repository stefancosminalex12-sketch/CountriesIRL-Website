# GitHub Pages build settings.
#
# These files are notes for whoever maintains the site, not pages for its
# visitors. Left in, GitHub Pages publishes them anyway — CONFIG.md even
# becomes a web page at /CONFIG.html that search engines can find — so they
# stay in the repository and out of the published site.
exclude:
  - README.md
  - CONFIG.md
  - LICENSE
  - assets/members/README.md
