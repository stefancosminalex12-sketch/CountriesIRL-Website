<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- SEO defaults. These mirror `meta` and `brand` in js/config.js, which
       also updates them at runtime — edit both if you change the wording. -->
  <title>CountriesIRL — the creators behind the world's countries</title>
  <meta name="description" content="CountriesIRL is a global network of creators representing the countries they know — through entertainment, culture, history and current events.">
  <link rel="canonical" href="https://countriesirl.com/">
  <meta name="theme-color" content="#16181c">

  <meta property="og:type" content="website">
  <meta property="og:site_name" content="CountriesIRL">
  <meta property="og:title" content="CountriesIRL — the creators behind the world's countries">
  <meta property="og:description" content="CountriesIRL is a global network of creators representing the countries they know — through entertainment, culture, history and current events.">
  <meta property="og:url" content="https://countriesirl.com/">
  <meta property="og:image" content="https://countriesirl.com/assets/og-image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="CountriesIRL — the creators behind the world’s countries.">
  <meta name="twitter:card" content="summary_large_image">

  <link rel="icon" href="assets/logo/favicon.png" type="image/png" sizes="64x64">
  <link rel="apple-touch-icon" href="assets/logo/apple-touch-icon.png">

  <link rel="stylesheet" href="css/style.css">
</head>

<body>
  <a class="skip-link" href="#main">Skip to content</a>

  <header class="site-header">
    <div class="container header__inner">
      <a class="brand" href="#home">
        <!-- alt is empty on purpose: the site name is right beside it, so the
             link already reads as "CountriesIRL" without repeating it. -->
        <img class="brand__mark" src="assets/logo/IRLLOGO-web.png" alt="" width="26" height="26"
             data-attr-src="brand.logo">
        <span class="brand__name" data-text="brand.name">CountriesIRL</span>
      </a>

      <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="primary-nav">
        <span class="nav-toggle__box" aria-hidden="true"><span></span><span></span><span></span></span>
        <span class="visually-hidden">Menu</span>
      </button>

      <nav class="nav" id="primary-nav" aria-label="Primary">
        <ul class="nav__list">
          <li><a class="nav__link" href="#home">Home</a></li>
          <li><a class="nav__link" href="#about">About</a></li>
          <li><a class="nav__link" href="#members">Members</a></li>
          <li><a class="nav__link" href="#community">Community</a></li>
          <li><a class="nav__cta" href="#join">Join</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <noscript>
    <div class="container noscript">
      <p>
        This page builds its content from a JavaScript configuration file, so it needs
        JavaScript enabled. CountriesIRL is a global network of creators representing
        the countries they know — write to <a href="mailto:hello@countriesirl.com">hello@countriesirl.com</a>
        if you would like to know more or apply to join.
      </p>
    </div>
  </noscript>

  <main id="main" tabindex="-1">

    <!-- ================= HOME ================= -->
    <section class="hero" id="home" tabindex="-1">
      <div class="container hero__inner">
        <p class="hero__eyebrow" data-text="hero.eyebrow"></p>
        <h1 data-text="hero.title"></h1>
        <div class="hero__description" data-paragraphs="hero.description"></div>
          <div class="btn-row">
          <a class="btn btn--invert" data-cta="hero.primaryCta" href="#join"></a>
          <a class="btn btn--ghost" data-cta="hero.secondaryCta" href="#about"></a>
          </div>
      </div>

      <!-- Every flag in the network, drifting across the foot of the hero.
           Decorative: the same flags are on the member cards below. -->
      <div class="marquee" data-render="flagMarquee" aria-hidden="true"></div>
    </section>

    <!-- The network in numbers. Its own band, below the fold, so the figures
         count themselves up as you scroll onto them. -->
    <section class="stats-band" aria-label="The network in numbers">
      <div class="container">
        <ul class="stats" data-render="stats" data-reveal></ul>
      </div>
    </section>

    <!-- ================= ABOUT ================= -->
    <section class="section" id="about" tabindex="-1" aria-labelledby="about-title">
      <div class="container">
        <div class="section-head about__head">
          <h2 id="about-title" data-text="about.title"></h2>
          <p class="lead lead--big" data-text="about.lead"></p>
        </div>

        <!-- One column, one comfortable measure — easier to read than the
             two-column split this used to be. -->
        <div class="prose prose--lead" data-paragraphs="about.body"></div>

        <div class="about__origin">
          <h3 class="about__origin-title" data-text="about.origin.title"></h3>
          <div class="prose prose--lead" data-paragraphs="about.origin.body"></div>
        </div>
      </div>
    </section>

    <!-- ================= MEMBERS ================= -->
    <section class="section section--tint" id="members" tabindex="-1" aria-labelledby="members-title">
      <div class="container">
        <div class="section-head">
          <h2 id="members-title" data-text="members.title"></h2>
          <p class="lead" data-text="members.lead"></p>
        </div>

        <div class="members__toolbar">
          <p class="members__count" id="member-status"></p>
        </div>

        <div class="members__grid" id="member-grid"></div>
      </div>
    </section>

    <!-- ================= COMMUNITY ================= -->
    <section class="section section--bordered" id="community" tabindex="-1" aria-labelledby="community-title">
      <div class="container">
        <div class="community__body">
          <h2 id="community-title" data-text="community.title"></h2>
          <p class="lead community__lead" data-text="community.lead"></p>
          <div class="prose prose--lead" data-paragraphs="community.body"></div>
          <p class="community__cta">
            <a class="link-arrow" data-cta="community.cta" href="#"></a>
          </p>
        </div>
      </div>
    </section>

    <!-- ================= JOIN ================= -->
    <section class="section join" id="join" tabindex="-1" aria-labelledby="join-title">
      <div class="container join__grid">
        <div>
          <h2 id="join-title" data-text="join.title"></h2>
          <p class="lead" data-text="join.lead"></p>
          <div class="btn-row">
            <a class="btn btn--invert" data-cta="join.cta" href="#"></a>
            <a class="btn btn--ghost" data-cta="join.discordCta" href="#"></a>
          </div>
          <p class="join__note" data-text="join.note"></p>
        </div>

        <aside class="join__aside">
          <p class="join__aside-title" data-text="join.aside.title"></p>
          <p class="join__aside-text" data-text="join.aside.text"></p>
        </aside>
      </div>
    </section>

  </main>

  <footer class="site-footer">
    <div class="container">
      <div class="footer__grid">
        <div class="footer__brand">
          <a class="brand" href="#home">
            <img class="brand__mark" src="assets/logo/IRLLOGO-web.png" alt="" width="26" height="26"
                 data-attr-src="brand.logo" data-attr-alt="brand.logoAlt">
            <span class="brand__name" data-text="brand.name"></span>
          </a>
          <p class="footer__note" data-text="footer.note"></p>
        </div>

        <div>
          <h2 class="footer__col-title">Sections</h2>
          <ul class="footer__list">
            <li><a href="#about">About</a></li>
            <li><a href="#members">Members</a></li>
            <li><a href="#community">Community</a></li>
            <li><a href="#join">Join</a></li>
          </ul>
        </div>

        <div>
          <h2 class="footer__col-title">Elsewhere</h2>
          <ul class="footer__list" data-render="social"></ul>
        </div>
      </div>

      <div class="footer__bottom">
        <p><span data-render="year"></span> <span data-text="brand.name"></span></p>
        <p data-render="contact"></p>
      </div>
    </div>
  </footer>

  <script src="js/config.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
